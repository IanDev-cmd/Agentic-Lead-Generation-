# Render Blueprint.
# The web service stays up and serves the desk plus /api.
# The cron is the one-shot research command. It is not a restarted web process.
# DRY_RUN stays true until you set a real key and webhook in the dashboard.
# The desk button posts the saved table and does not call Gemini.

services:
  - type: web
    name: lead-desk
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node server.js
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DRY_RUN
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: DESK_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SELLER_NAME
        sync: false
      - key: SELLER_OFFERING
        sync: false
      - key: TARGET_INDUSTRY
        sync: false
      - key: TARGET_REGION
        sync: false
      - key: IDEAL_CUSTOMER_PROFILE
        sync: false

  - type: cron
    name: lead-research
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node index.js
    schedule: "0 6 * * 1"
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: SELLER_NAME
        sync: false
      - key: SELLER_OFFERING
        sync: false
      - key: TARGET_INDUSTRY
        sync: false
      - key: TARGET_REGION
        sync: false
      - key: IDEAL_CUSTOMER_PROFILE
        sync: false
