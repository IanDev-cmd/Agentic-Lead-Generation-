# Web service. Leave PORT unset so Render assigns it.
# DRY_RUN stays true until you choose a live Gemini run.
# Keys with sync: false are empty on the Render form. Paste those.

services:
  - type: web
    name: lead-desk
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node server.js
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: DRY_RUN
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: FORCE_FREE_TIER
        value: "false"
      - key: VERIFY_BILLING
        value: "true"
      - key: DEEP_RESEARCH_AGENT
        value: deep-research-preview-04-2026
      - key: MAX_LEADS
        value: "8"
      - key: FREE_MODEL
        value: gemini-3.8-flash
      - key: FREE_GROUNDING_CALLS_PER_RUN
        value: "5"
      - key: PIPELINE_ENABLED
        value: "true"
      - key: PIPELINE_MAX_QUERIES
        value: "14"
      - key: PIPELINE_CONCURRENCY
        value: "3"
      - key: PIPELINE_DEADLINE_MS
        value: "80000"
      - key: PIPELINE_MIN_TIER
        value: "B"
      - key: PIPELINE_ENTERPRISE_HINTS
        value: "listed bank,national telecom,national health system,multinational"
      - key: USE_BROWSER_AGENT
        value: "false"
      - key: POLL_INITIAL_DELAY_MS
        value: "5000"
      - key: POLL_MAX_DELAY_MS
        value: "60000"
      - key: POLL_BACKOFF_FACTOR
        value: "1.5"
      - key: POLL_MAX_WAIT_MS
        value: "3600000"
      - key: POLL_MAX_TRANSIENT_ERRORS
        value: "8"
      - key: REQUEST_TIMEOUT_MS
        value: "120000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:desk@localhost
      - key: GEOCODER_USER_AGENT
        value: lead-desk/1.0
      - key: GEOCODER_EMAIL
        sync: false
