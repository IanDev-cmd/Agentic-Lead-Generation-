<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07161e">
<title>Lead desk is offline</title>
<style>
  html, body { margin: 0; min-height: 100dvh; }
  body {
    display: grid;
    place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    background: #04141c;
    color: #fff;
    font-family: "Segoe UI", sans-serif;
  }
  main { width: min(420px, 100%); text-align: left; }
  p.brand { margin: 0 0 12px; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
  h1 { margin: 0 0 12px; font-size: 40px; font-weight: 700; letter-spacing: 0.04em; }
  p { margin: 0 0 22px; font-size: 15px; line-height: 1.5; color: rgba(255,255,255,0.92); }
  button {
    min-width: 118px;
    min-height: 44px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1.5px solid #fff;
    background: transparent;
    color: #fff;
    font: 600 14px "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<main>
  <p class="brand">Lead</p>
  <h1>OFFLINE</h1>
  <p>This page is not on the device yet. Reconnect, then open the desk again. Saved screens you already visited can still open.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').onclick = () => location.reload();
</script>
</body>
</html>
